[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E501"]
"app/services/ai/templates.py" = ["E501"]
"app/services/ai/domain_data.py" = ["E501"]
"app/services/ai/reasoning.py" = ["E501"]
"app/services/ai/prompts.py" = ["E501"]
"app/services/ai/agents.py" = ["E501"]
"app/services/ai/v3_architect.py" = ["E501"]
"app/services/export/markdown.py" = ["E501"]
"app/services/export/exporters.py" = ["E501"]
"app/services/memory.py" = ["E501"]
"app/api/projects.py" = ["E501"]
"app/services/codegen/*" = ["E501"]
"app/services/diagrams/*" = ["E501"]
"app/services/pm/*" = ["E501"]
